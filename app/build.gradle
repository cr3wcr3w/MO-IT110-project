 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/9.4.1/userguide/building_java_projects.html in the Gradle documentation.
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'com.diffplug.spotless' version '8.4.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        target '*.gradle', '../*.gradle', '../*.md', '../.gitignore',
                '../gradle/*.toml', '../scripts/*.sh', '../scripts/*.bat', '../scripts/*.ps1'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'org.example.App'
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main']
        }
        resources {
            srcDirs = ['src/main/org/example/resources']
        }
    }

    test {
        java {
            srcDirs = ['src/test']
        }
    }
}

test {
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "short"
    }
}
